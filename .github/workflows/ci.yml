name: CI
on:
  push:
  pull_request:
jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject Python and require AGPL headers
        run: |
          set -eu
          if find . -name '*.py' -print | grep -q .; then
            echo 'Python sources are not allowed' >&2
            find . -name '*.py' -print >&2
            exit 1
          fi
          test -f src/lexer/alplex.asm
          test -f src/horn/hornres.asm
          test -f src/sparse/vxmexec.asm
          test -f LICENSE
          grep -q 'AGPL-3.0-only' LICENSE
          grep -q 'SPDX-License-Identifier: AGPL-3.0-only' src/lexer/alplex.asm
          grep -q 'SPDX-License-Identifier: AGPL-3.0-only' src/horn/hornres.asm
          grep -q 'SPDX-License-Identifier: AGPL-3.0-only' src/sparse/vxmexec.asm
          echo 'tree check passed'
