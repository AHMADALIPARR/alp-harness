[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alp-harness"
version = "0.1.0"
description = "Structured-assembly constraint harness with Horn clauses and algebraic annotations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Ahmad Ali Parr"}]
keywords = ["horn-clauses", "graphblas", "constraints", "assembly"]

[project.scripts]
alp-harness = "alp_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
